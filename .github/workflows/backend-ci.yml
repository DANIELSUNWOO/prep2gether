# .github/workflows/backend-ci.yml
name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create application.yaml for test
        run: |
          cat <<EOF > src/main/resources/application.yaml
          spring:
            datasource:
              url: jdbc:h2:mem:testdb
              driver-class-name: org.h2.Driver
            jpa:
              hibernate:
                ddl-auto: create-drop
            mail:
              host: smtp.gmail.com
              port: 587
              username: test@gmail.com
              password: test-app-password
              properties:
                mail:
                  smtp:
                    auth: true
                    starttls:
                      enable: true
          jwt:
            secret: test-secret-for-ci-only-not-real-do-not-use-in-prod
            access-token-expiration: 3600000
            refresh-token-expiration: 1209600000
          portone:
            store-id: store-ci-test
            channel-key-payment: channel-key-ci-payment
            channel-key-billing: channel-key-ci-billing
            api-secret: ci-api-secret-not-real
            webhook-secret: ci-webhook-secret-not-real            
            billing-key-secret: ci-billing-key-secret-not-real
            payment-id-prefix: ci-test-
            test-mode: true
            subscription:
              amount: 9900
              currency: KRW
              order-name: 프리미엄 구독 1개월
          cloud:
            aws:
              s3:
                bucket: test-bucket
              region:
                static: ap-northeast-2
              credentials:
                access-key: test-access-key
                secret-key: test-secret-key
          EOF

      - name: Build & Test
        run: ./gradlew clean build