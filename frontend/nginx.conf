# 인증서 발급 완료 후 부트스트랩 설정을 이 최종 SSL 설정으로 교체했다.

server {
    listen 80;
    server_name prep2gether-sunwoo.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 https로 리다이렉트.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name prep2gether-sunwoo.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/prep2gether-sunwoo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prep2gether-sunwoo.duckdns.org/privkey.pem;

    # 이미지 첨부 한도를 백엔드(spring.servlet.multipart.max-request-size=10MB)와 맞춘다.
    # 기본값 1MB로 두면 1MB를 넘는 사진이 백엔드에 닿기도 전에 413으로 막힌다.
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/   { proxy_pass http://backend:8080/swagger-ui/; }
    location /swagger-ui.html { proxy_pass http://backend:8080/swagger-ui.html; }
    location /v3/api-docs   { proxy_pass http://backend:8080/v3/api-docs; }
    location /v3/api-docs/  { proxy_pass http://backend:8080/v3/api-docs/; }
}
